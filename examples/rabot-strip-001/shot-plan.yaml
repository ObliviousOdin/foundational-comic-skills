# Filled-in instance of comic-direction/comic-director/assets/templates/shot-plan-template.yaml
# Strip 001: "Night Shift" - Rabot and Echo, the first thermos.

shot_plan:
  project: "Rabot"
  episode: "season-1"
  strip_id: "strip-001"
  format: "3-panel-horizontal"
  narrative_pattern: "setup-reinforce-turnaround"
  reading_direction: "ltr"
  vision_check: "quiet, warm, precise"

# Cues extracted (comic-story-derivation):
#   MOOD: tired but settled        WARDROBE: practical night-shift
#   SETTING: control room          PROP: dented thermos
#   RELATIONSHIP (Rabot+Echo): parallel solitude, easing toward company

panels:
  - panel: 1
    beat_role: "SETUP"
    shot_size: "medium"
    camera_angle: "eye-level"
    staging: "fg console + thermos; mid Rabot seated; bg monitor wall; Echo dim at frame right edge"
    eyeline_vector: "Rabot looks right toward monitors (exit vector to P2)"
    transition_in: "n/a"
    pacing_weight: "medium"
    gutter_before: "n/a"
    dialogue:
      bubbles: 1
      lines: ["Quiet shift tonight."]
      placement: "upper-left dead zone above monitor wall"
    crop_check:
      action_legible: true
      context_present: true
      mood_served: true
      composition_satisfying: true
    notes: "Echo introduced dim and peripheral - the strip is about her stepping out of the background"

  - panel: 2
    beat_role: "REINFORCE"
    shot_size: "close-up"
    camera_angle: "eye-level"
    transition_in: "subject"
    staging: "Echo's hand entering frame left, setting a second cup beside the thermos; Rabot's surprised eyes upper frame"
    eyeline_vector: "Rabot's gaze drops to the cup, pulling reader down-right toward P3"
    pacing_weight: "medium"
    gutter_before: "narrow"
    dialogue:
      bubbles: 0
      lines: []
      placement: "silent - the gesture carries the beat"
    crop_check:
      action_legible: true
      context_present: true
      mood_served: true
      composition_satisfying: true
    notes: "Silent beat per retro-manga harness; single sweat drop on Rabot, era-appropriate"

  - panel: 3
    beat_role: "TURNAROUND"
    shot_size: "wide"
    camera_angle: "eye-level"
    transition_in: "action"
    staging: "two-shot: Rabot and Echo side by side at the console, two cups steaming; monitor wall tone-flattened behind them"
    eyeline_vector: "both face the monitor glow - shared direction = relationship one step closer"
    pacing_weight: "large"
    gutter_before: "wide"
    dialogue:
      bubbles: 1
      lines: ["...you take yours cold."]
      placement: "upper-right dead zone, clear of Echo's temple light"
    crop_check:
      action_legible: true
      context_present: true
      mood_served: true
      composition_satisfying: true
    notes: "180 axis: Rabot screen-left, Echo screen-right, locked for the scene. RETAKE history: v1 balloon covered Echo's indicator light; moved upper-right"

name_criteria:
  strong_first_panel: true
  layout_effortless: true
  action_always_clear: true
  shifts_convincing: true
  emotion_legible: true

final_cut:
  verdict: "ACCEPT"
  corrective_field: ""
  artistic_life_note: "P2 silence does the work; wobble and tone edges read hand-made; signed"
