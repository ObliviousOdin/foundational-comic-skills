<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" role="img" aria-labelledby="title desc">
  <title id="title">Comic Skill Stack Map</title><desc id="desc">Layered system map of foundational comic skills.</desc>
  <defs><style><![CDATA[
    .bg{fill:#020617}.grid{stroke:#1e293b;stroke-width:1}.h1{font:900 42px system-ui;fill:#f8fafc}.h2{font:800 23px system-ui;fill:#f8fafc}.txt{font:600 16px system-ui;fill:#cbd5e1}.mono{font:700 13px ui-monospace,Menlo,monospace;fill:#e2e8f0}.box{rx:18;stroke-width:3}.arrow{stroke:#facc15;stroke-width:5;fill:none;marker-end:url(#arr);stroke-linecap:round}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  ]]></style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#facc15"/></marker></defs>
  <rect class="bg" width="1300" height="780"/><g opacity="0.35">
    <path class="grid" d="M0 80H1300M0 160H1300M0 240H1300M0 320H1300M0 400H1300M0 480H1300M0 560H1300M0 640H1300M0 720H1300M80 0V780M160 0V780M240 0V780M320 0V780M400 0V780M480 0V780M560 0V780M640 0V780M720 0V780M800 0V780M880 0V780M960 0V780M1040 0V780M1120 0V780M1200 0V780M1280 0V780"/>
  </g>
  <text x="60" y="70" class="h1">Comic Skill Stack Map</text><text x="62" y="102" class="txt">The repository as a production line: law → memory → judgment → style → pipeline → publish.</text>
  <g transform="translate(60 150)"><rect class="box" width="230" height="120" fill="rgba(14,165,233,.25)" stroke="#38bdf8"/><text x="24" y="38" class="h2">Core Laws</text><text x="24" y="70" class="mono">comic-core/</text><text x="24" y="96" class="txt">contracts · formats · gates</text></g>
  <path class="arrow" d="M300 210 H386"/>
  <g transform="translate(400 150)"><rect class="box" width="250" height="120" fill="rgba(168,85,247,.25)" stroke="#c084fc"/><text x="24" y="38" class="h2">Memory</text><text x="24" y="70" class="mono">comic-consistency/</text><text x="24" y="96" class="txt">bible · DNA · style memory</text></g>
  <path class="arrow" d="M660 210 H746"/>
  <g transform="translate(760 150)"><rect class="box" width="220" height="120" fill="rgba(251,113,133,.25)" stroke="#fb7185"/><text x="24" y="38" class="h2">Direction</text><text x="24" y="70" class="mono">producer + director</text><text x="24" y="96" class="txt">contract · shot plan · cut</text></g>
  <path class="arrow" d="M990 210 H1076"/>
  <g transform="translate(1090 150)"><rect class="box" width="160" height="120" fill="rgba(250,204,21,.25)" stroke="#fde047"/><text x="24" y="38" class="h2">Styles</text><text x="24" y="70" class="mono">28 skills</text><text x="24" y="96" class="txt">Schema v2</text></g>
  <path class="arrow" d="M1170 284 C1170 344 1034 346 1034 404"/>
  <g transform="translate(830 420)"><rect class="box" width="310" height="120" fill="rgba(52,211,153,.22)" stroke="#34d399"/><text x="24" y="38" class="h2">Pipelines</text><text x="24" y="70" class="mono">3-panel · 4-koma · webtoon</text><text x="24" y="96" class="txt">chapter · emotional arc</text></g>
  <path class="arrow" d="M820 480 H704"/>
  <g transform="translate(430 420)"><rect class="box" width="260" height="120" fill="rgba(249,115,22,.25)" stroke="#fb923c"/><text x="24" y="38" class="h2">Production</text><text x="24" y="70" class="mono">export + publish</text><text x="24" y="96" class="txt">delivery specs</text></g>
  <path class="arrow" d="M420 480 H304"/>
  <g transform="translate(60 420)"><rect class="box" width="230" height="120" fill="rgba(148,163,184,.22)" stroke="#94a3b8"/><text x="24" y="38" class="h2">Validator</text><text x="24" y="70" class="mono">tools/validate.py</text><text x="24" y="96" class="txt">CI keeps contracts honest</text></g>
  <g class="pulse" transform="translate(360 625)"><rect width="580" height="72" rx="36" fill="rgba(253,224,71,.16)" stroke="#fde047" stroke-width="3"/><text x="42" y="45" class="h2">Output: long-form comics with continuity, taste, and traceability</text></g>
</svg>
