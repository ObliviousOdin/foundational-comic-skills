<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">foundational-comic-skills animated hero</title>
  <desc id="desc">Animated comic panels showing producer, director, world bible, style stack, and publishing pipeline.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#18122B"/><stop offset="0.48" stop-color="#352F75"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
    <linearGradient id="burst" x1="0" x2="1"><stop stop-color="#FDE047"/><stop offset="1" stop-color="#FB7185"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.38"/></filter>
    <style><![CDATA[
      .title{font:900 58px/1.05 system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff;letter-spacing:-1px}.sub{font:600 22px system-ui;fill:#D8B4FE}.micro{font:700 15px ui-monospace,Menlo,monospace;fill:#0F172A}.label{font:800 24px system-ui;fill:#111827}.caption{font:650 16px system-ui;fill:#334155}.panel{fill:#FFF7ED;stroke:#0F172A;stroke-width:5;filter:url(#shadow)}.ink{stroke:#111827;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.spark{fill:#FDE047;stroke:#111827;stroke-width:3}.dot{animation:pulse 1.7s ease-in-out infinite}.float{animation:float 4.2s ease-in-out infinite}.float2{animation:float 5.2s ease-in-out infinite reverse}.slide{animation:slide 7s ease-in-out infinite}.pop{transform-origin:center;animation:pop 2.8s ease-in-out infinite}.dash{stroke-dasharray:12 10;animation:dash 16s linear infinite}@keyframes pulse{0%,100%{opacity:.45;r:5}50%{opacity:1;r:9}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes dash{to{stroke-dashoffset:-220}}
    ]]></style>
  </defs>
  <rect width="1400" height="560" fill="url(#sky)"/>
  <g opacity="0.22"><path class="dash" d="M40 92 C270 10 382 171 565 85 S897 50 1020 154 1235 180 1350 90" stroke="#A78BFA" stroke-width="6" fill="none"/><path class="dash" d="M75 460 C290 355 410 510 620 420 S955 342 1128 445 1248 488 1360 378" stroke="#67E8F9" stroke-width="5" fill="none"/></g>
  <text x="54" y="86" class="title">Foundational Comic Skills</text>
  <text x="58" y="124" class="sub">A production-grade skill stack for comics that remember who they are.</text>
  <g transform="translate(56 172)"><rect width="294" height="248" rx="24" class="panel"/><text x="26" y="44" class="label">1. Producer</text><text x="26" y="72" class="caption">locks the promise</text><g transform="translate(38 104)"><path d="M38 0 h134 l28 30 -28 30 H38 L10 30z" fill="#FDE68A" stroke="#111827" stroke-width="5"/><text x="38" y="37" class="micro">CONTRACT</text></g><g class="pop"><circle cx="224" cy="155" r="44" fill="#FB7185" stroke="#111827" stroke-width="5"/><text x="190" y="161" class="micro">GREEN</text><text x="198" y="180" class="micro">LIGHT</text></g></g>
  <g transform="translate(386 142)"><rect width="294" height="298" rx="24" class="panel"/><text x="26" y="44" class="label">2. Director</text><text x="26" y="72" class="caption">turns beats into shots</text><g transform="translate(34 108)"><rect width="218" height="104" rx="10" fill="#C4B5FD" stroke="#111827" stroke-width="5"/><line x1="0" y1="36" x2="218" y2="36" class="ink"/><line x1="72" y1="0" x2="72" y2="104" class="ink"/><line x1="146" y1="0" x2="146" y2="104" class="ink"/><text x="16" y="70" class="micro">WIDE</text><text x="88" y="70" class="micro">CUT</text><text x="158" y="70" class="micro">BEAT</text></g><path class="ink" d="M52 244 q84 -48 180 0"/><circle class="dot" cx="86" cy="233" r="6" fill="#22D3EE"/><circle class="dot" cx="147" cy="219" r="6" fill="#22D3EE"/><circle class="dot" cx="210" cy="233" r="6" fill="#22D3EE"/></g>
  <g transform="translate(716 172)"><rect width="294" height="248" rx="24" class="panel"/><text x="26" y="44" class="label">3. World Bible</text><text x="26" y="72" class="caption">one memory, many panels</text><g transform="translate(46 108)"><rect width="178" height="104" rx="12" fill="#BFDBFE" stroke="#111827" stroke-width="5"/><line x1="22" y1="30" x2="154" y2="30" class="ink"/><line x1="22" y1="56" x2="132" y2="56" class="ink"/><line x1="22" y1="82" x2="146" y2="82" class="ink"/></g><path d="M231 131 l22 12 -22 12 8 24 -22-14 -22 14 8-24 -22-12 22-12 -8-24 22 14 22-14z" class="spark pop"/></g>
  <g transform="translate(1046 142)"><rect width="294" height="298" rx="24" class="panel"/><text x="26" y="44" class="label">4. Publish</text><text x="26" y="72" class="caption">quality gates, export specs</text><g transform="translate(34 110)"><rect width="226" height="138" rx="18" fill="#BBF7D0" stroke="#111827" stroke-width="5"/><text x="30" y="48" class="micro">✓ Bible trace</text><text x="30" y="78" class="micro">✓ Shot plan</text><text x="30" y="108" class="micro">✓ Style locks</text></g><g><path d="M202 238 h54 v30 h-54z" fill="#FCA5A5" stroke="#111827" stroke-width="5"/><text x="210" y="259" class="micro">PDF</text></g></g>
  <g transform="translate(566 486)"><rect width="270" height="44" rx="22" fill="url(#burst)" stroke="#111827" stroke-width="4"/><text x="28" y="29" class="micro">NO PANEL WITHOUT A PURPOSE</text></g>
</svg>
